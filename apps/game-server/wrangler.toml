# Coup Online — game server (Cloudflare Worker).
# Architecture reference: SKILL.md § 3.3, 3.4.

name = "coup-online-game-server"
main = "src/index.ts"
compatibility_date = "2026-05-14"
# Required by Better Auth — it imports `node:async_hooks`. Cloudflare's
# nodejs_compat polyfills the subset we need. SKILL.md § 5 — Web Crypto
# remains the rule for our own code; this flag is purely so Better Auth's
# internals don't crash at runtime.
compatibility_flags = ["nodejs_compat"]

# Durable Object bindings.

[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MATCHMAKING_QUEUE"
class_name = "MatchmakingQueue"

[[durable_objects.bindings]]
name = "ROOM_CODE_REGISTRY"
class_name = "RoomCodeRegistry"

# HTTP rate-limit registry — a single DO instance holds per-user sliding-
# window counters for sensitive endpoints (uploads, patches, account
# deletion, admin actions). See src/do-rate-limit.ts.
[[durable_objects.bindings]]
name = "RATE_LIMIT"
class_name = "RateLimitRegistry"

# DO migrations.
# per SKILL.md § 3.3 — SQLite-backed only. `new_classes` would create key-value DOs
# (paid-plan only) and break the free-tier budget. Never change this to `new_classes`.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "MatchmakingQueue", "RoomCodeRegistry"]

# v2 adds the rate-limit registry. New DO classes go in a new migration tag —
# DO migrations are append-only once deployed.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimitRegistry"]

# D1 binding — uncomment after running once:
#   pnpm --filter @coup-online/game-server exec wrangler d1 create coup-online-db
# Then paste the returned `database_id` below.
[[d1_databases]]
binding = "DB"
database_name = "coup-online-db"
database_id = "4420c671-5adb-4a9b-8c7d-24bc031946cb"
# Drizzle migrations live in packages/db; wrangler d1 migrations apply uses this path.
migrations_dir = "../../packages/db/drizzle/migrations"

# R2 bucket — user-uploaded avatars (SKILL.md § 2). R2 has a permanent free
# tier (10 GB storage), so this stays inside the zero-dollar v1 budget. Create
# the bucket once before the first deploy:
#   pnpm --filter @coup-online/game-server exec wrangler r2 bucket create coup-online-avatars
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "coup-online-avatars"
